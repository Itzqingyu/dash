[project]
name = "dash_backend"
version = "0.1.0"
description = "DASH (Decision, Activity, Schedule, History) Backend Service"
readme = "log.md"
authors = [
    { name = "qingyu", email = "yoyo8720269@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "litellm>=1.100.0",
    "pgvector>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.13.5",
    "pyinstaller>=6.22.2",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
